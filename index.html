<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasaki - Cải tiến Thẻ Sản Phẩm</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V23N3GTMJR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-V23N3GTMJR');
</script>
</head>
<body>
    <div class="container">
        <h2 class="section-title">Sản Phẩm Đề Xuất</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="product-badge">-20%</div>
                <img src="https://via.placeholder.com/200?text=Sua+Rua+Mat" alt="Sữa rửa mặt" class="product-img">
                <div class="product-info">
                    <h3 class="product-name">Sữa Rửa Mặt Cetaphil Dịu Nhẹ 500ml</h3>
                    <div class="product-price">
                        <span class="new-price">285.000đ</span>
                        <span class="old-price">350.000đ</span>
                    </div>
                    <button class="btn-add-cart">Thêm vào giỏ</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-badge">-15%</div>
                <img src="https://via.placeholder.com/200?text=Nuoc+Tay+Trang" alt="Nước tẩy trang" class="product-img">
                <div class="product-info">
                    <h3 class="product-name">Nước Tẩy Trang Bioderma Sensibio H2O 500ml</h3>
                    <div class="product-price">
                        <span class="new-price">420.000đ</span>
                        <span class="old-price">495.000đ</span>
                    </div>
                    <button class="btn-add-cart">Thêm vào giỏ</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-badge">-10%</div>
                <img src="https://via.placeholder.com/200?text=Kem+Chong+Nang" alt="Kem chống nắng" class="product-img">
                <div class="product-info">
                    <h3 class="product-name">Kem Chống Nắng La Roche-Posay 50ml</h3>
                    <div class="product-price">
                        <span class="new-price">450.000đ</span>
                        <span class="old-price">500.000đ</span>
                    </div>
                    <button class="btn-add-cart">Thêm vào giỏ</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-badge">-30%</div>
                <img src="https://via.placeholder.com/200?text=Toner" alt="Toner" class="product-img">
                <div class="product-info">
                    <h3 class="product-name">Nước Hoa Hồng Klairs Không Mùi 250ml</h3>
                    <div class="product-price">
                        <span class="new-price">270.000đ</span>
                        <span class="old-price">385.000đ</span>
                    </div>
                    <button class="btn-add-cart">Thêm vào giỏ</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
